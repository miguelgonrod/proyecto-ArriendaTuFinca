<div class="container mt-5 pt-5">
    <h1>Propiedades</h1>
  
    <form class="form-card">
      <div class="form-group">
        <label for="nombre">Nombre de la propiedad</label>
        <input type="text" id="nombre" class="form-control" placeholder="Nombre">
      </div>
      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" class="form-control" placeholder="Dirección">
      </div>
      <button type="submit" class="btn">Agregar Propiedad</button>
    </form>
  
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let propiedad of propiedades">
            <td>{{ propiedad.id }}</td>
            <td>{{ propiedad.descripcion }}</td>  <!-- Asumimos que 'descripcion' es el nombre -->
            <td>{{ propiedad.direccion }}</td>
            <td>
              <button class="btn-edit">Editar</button>
              <button class="btn-delete">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
