<div class="register-container">
  <h1>Bienvenido a RenVac</h1>
  <form (ngSubmit)="register()" #registerForm="ngForm">
    <div>
      <label for="username">Nombre de usuario</label>
      <input
        type="text"
        id="username"
        [(ngModel)]="user.nombre"
        name="username"
        #username="ngModel"
        required
      />
      <div *ngIf="username.invalid && username.touched" class="error">
        El nombre de usuario es obligatorio.
      </div>
    </div>

    <div>
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="user.email"
        name="email"
        #email="ngModel"
        required
      />
      <div *ngIf="email.invalid && email.touched" class="error">
        Por favor, introduce un correo válido.
      </div>
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="user.password"
        name="password"
        #password="ngModel"
        required
      />
      <div *ngIf="password.invalid && password.touched" class="error">
        La contraseña es obligatoria.
      </div>
    </div>

    <div>
      <label for="phone">Teléfono</label>
      <input
        type="tel"
        id="phone"
        [(ngModel)]="user.telefono"
        name="phone"
        #phone="ngModel"
        required
      />
      <div *ngIf="phone.invalid && phone.touched" class="error">
        El teléfono es obligatorio.
      </div>
    </div>

    <div>
      <label for="role">Tipo de usuario</label>
      <select id="role" [(ngModel)]="user.role" name="role" required>
        <option value="" disabled>Selecciona un rol</option>
        <option value="arrendador">Arrendador</option>
        <option value="arrendatario">Arrendatario</option>
      </select>
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Crear cuenta</button>
  </form>
</div>
