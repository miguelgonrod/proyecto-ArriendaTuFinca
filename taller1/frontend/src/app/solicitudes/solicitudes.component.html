<div class="container mt-5 pt-5">
    <h1>Solicitudes de Arrendamiento</h1>
  
    <form class="form-card">
      <div class="form-group">
        <label for="solicitante">Solicitante</label>
        <input type="text" id="solicitante" class="form-control" placeholder="Nombre del solicitante">
      </div>
      <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" class="form-control">
      </div>
      <button type="submit" class="btn">Crear Solicitud</button>
    </form>
  
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Solicitante</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let solicitud of solicitudes">
            <td>{{ solicitud.id }}</td>
            <td>{{ solicitud.usuarioId }}</td>  <!-- Asumimos que usuarioId representa al solicitante -->
            <td>{{ solicitud.fechaSolicitud | date }}</td>
            <td>
              <button class="btn-edit">Editar</button>
              <button class="btn-delete">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
