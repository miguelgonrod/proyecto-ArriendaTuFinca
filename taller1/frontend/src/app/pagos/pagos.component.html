<div class="container mt-5 pt-5">
  <h1>PAGOS</h1>

  <form class="form-card" (ngSubmit)="crearPago()">
    <div class="form-group">
      <label for="monto">Monto</label>
      <input type="number" id="monto" class="form-control" [(ngModel)]="nuevoPago.monto" name="monto" placeholder="Monto del pago">
    </div>
    <div class="form-group">
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" class="form-control" [(ngModel)]="nuevoPago.fechaPago" name="fecha">
    </div>
    <button type="submit" class="btn">Registrar Pago</button>
  </form>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Monto</th>
          <th>Fecha</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pago of pagos">
          <td>{{ pago.id }}</td>
          <td>{{ pago.monto }}</td>
          <td>{{ pago.fechaPago | date }}</td>
          <td>
            <button class="btn-delete" (click)="eliminarPago(pago.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
