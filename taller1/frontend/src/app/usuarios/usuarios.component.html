<div class="container mt-5 pt-5">
  <h1>Usuarios</h1>

  <form class="form-card" (ngSubmit)="crearUsuario()">
    <div class="form-group">
      <label for="nombre">Nombre del usuario</label>
      <input type="text" id="nombre" class="form-control" [(ngModel)]="nuevoUsuario.nombre" name="nombre" placeholder="Nombre" required>
    </div>
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" class="form-control" [(ngModel)]="nuevoUsuario.email" name="email" placeholder="Correo" required>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" class="form-control" [(ngModel)]="nuevoUsuario.password" name="password" placeholder="Contraseña" required>
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input type="text" id="telefono" class="form-control" [(ngModel)]="nuevoUsuario.telefono" name="telefono" placeholder="Teléfono" required>
    </div>
    <button type="submit" class="btn">Agregar Usuario</button>
  </form>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td>{{ usuario.id }}</td>
          <td>{{ usuario.nombre }}</td>
          <td>{{ usuario.email }}</td>
          <td>
            <button class="btn-edit">Editar</button>
            <button class="btn-delete" (click)="eliminarUsuario(usuario.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
