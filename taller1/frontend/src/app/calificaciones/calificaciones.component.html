<div class="container mt-5 pt-5">
    <h1>Calificaciones</h1>
  
    <form class="form-card">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" class="form-control" placeholder="Nombre de la calificación">
      </div>
      <div class="form-group">
        <label for="puntuacion">Puntuación</label>
        <input type="number" id="puntuacion" class="form-control" placeholder="Puntuación (1-10)">
      </div>
      <button type="submit" class="btn">Agregar Calificación</button>
    </form>
  
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Puntuación</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let calificacion of calificaciones">
            <td>{{ calificacion.id }}</td>
            <td>{{ calificacion.nombre }}</td>
            <td>{{ calificacion.puntuacion }}</td>
            <td>
              <button class="btn-edit">Editar</button>
              <button class="btn-delete">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
